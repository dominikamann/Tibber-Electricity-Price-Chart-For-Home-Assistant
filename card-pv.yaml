type: custom:apexcharts-card
apex_config:
  grid:
    show: true
    borderColor: '#E0E0E0'
  chart:
    height: 300px
  # Short legend: price colours explain themselves
  legend:
    show: true
    customLegendItems:
      - PV-Prognose (P10–P90)
      - PV tatsächlich
    markers:
      fillColors:
        - '#64B5F6'
        - '#1E88E5'
    formatter: 'EVAL:function(name) { return name; }'
    onItemClick:
      toggleDataSeries: false
    onItemHover:
      highlightDataSeries: false
  tooltip:
    enabled: true
    followCursor: false
    x:
      show: true
      format: 'ddd HH:mm'
    fixed:
      enabled: true
header:
  show: true
  title: Strompreis & PV-Prognose
  show_states: true
  colorize_states: true
  standard_format: false
# 6 hours back, 30 hours ahead
graph_span: 36h
span:
  start: hour
  offset: -6h
now:
  show: true
  color: 9E9E9E
yaxis:
  - id: price
    decimals: 0
    apex_config:
      title:
        text: ct/kWh
  - id: pv
    opposite: true
    min: 0
    decimals: 1
    apex_config:
      title:
        text: kW
series:
  # Thin line through all prices; connects the coloured segments
  - entity: sensor.tibber_price_data
    name: Preis
    yaxis_id: price
    unit: ct/kWh
    color: 9E9E9E
    type: line
    curve: stepline
    stroke_width: 1
    extend_to: false
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const prices = (entity.attributes.today || []).concat(entity.attributes.tomorrow || []);
      const data = prices.map(p => [new Date(p.startsAt).getTime(), p.total * 100]);
      if (data.length > 1) data.push([2 * data[data.length - 1][0] - data[data.length - 2][0], data[data.length - 1][1]]);
      return data;
  # Günstig: compared with the average of the same day (±10 %)
  - entity: sensor.tibber_price_data
    name: Günstig
    yaxis_id: price
    unit: ct/kWh
    color: 43A047
    type: line
    curve: stepline
    stroke_width: 4
    extend_to: false
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const cls = 'cheap';
      const prices = (entity.attributes.today || []).concat(entity.attributes.tomorrow || []);
      const days = {};
      prices.forEach(p => (days[p.startsAt.slice(0, 10)] ??= []).push(p.total));
      const avg = d => days[d].reduce((a, b) => a + b, 0) / days[d].length;
      const level = p => {
        const a = avg(p.startsAt.slice(0, 10));
        return p.total <= a - 0.1 * Math.abs(a) ? 'cheap' : p.total >= a + 0.1 * Math.abs(a) ? 'expensive' : 'normal';
      };
      const data = [];
      prices.forEach((p, i) => {
        const t = new Date(p.startsAt).getTime();
        const next = i + 1 < prices.length ? new Date(prices[i + 1].startsAt).getTime() : 2 * t - new Date(prices[i - 1]?.startsAt ?? t - 900000).getTime();
        if (level(p) === cls) data.push([t, p.total * 100], [next - 1, p.total * 100]);
        else data.push([t, null]);
      });
      return data;
  # Normal: compared with the average of the same day (±10 %)
  - entity: sensor.tibber_price_data
    name: Normal
    yaxis_id: price
    unit: ct/kWh
    color: FBC02D
    type: line
    curve: stepline
    stroke_width: 4
    extend_to: false
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const cls = 'normal';
      const prices = (entity.attributes.today || []).concat(entity.attributes.tomorrow || []);
      const days = {};
      prices.forEach(p => (days[p.startsAt.slice(0, 10)] ??= []).push(p.total));
      const avg = d => days[d].reduce((a, b) => a + b, 0) / days[d].length;
      const level = p => {
        const a = avg(p.startsAt.slice(0, 10));
        return p.total <= a - 0.1 * Math.abs(a) ? 'cheap' : p.total >= a + 0.1 * Math.abs(a) ? 'expensive' : 'normal';
      };
      const data = [];
      prices.forEach((p, i) => {
        const t = new Date(p.startsAt).getTime();
        const next = i + 1 < prices.length ? new Date(prices[i + 1].startsAt).getTime() : 2 * t - new Date(prices[i - 1]?.startsAt ?? t - 900000).getTime();
        if (level(p) === cls) data.push([t, p.total * 100], [next - 1, p.total * 100]);
        else data.push([t, null]);
      });
      return data;
  # Teuer: compared with the average of the same day (±10 %)
  - entity: sensor.tibber_price_data
    name: Teuer
    yaxis_id: price
    unit: ct/kWh
    color: E53935
    type: line
    curve: stepline
    stroke_width: 4
    extend_to: false
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const cls = 'expensive';
      const prices = (entity.attributes.today || []).concat(entity.attributes.tomorrow || []);
      const days = {};
      prices.forEach(p => (days[p.startsAt.slice(0, 10)] ??= []).push(p.total));
      const avg = d => days[d].reduce((a, b) => a + b, 0) / days[d].length;
      const level = p => {
        const a = avg(p.startsAt.slice(0, 10));
        return p.total <= a - 0.1 * Math.abs(a) ? 'cheap' : p.total >= a + 0.1 * Math.abs(a) ? 'expensive' : 'normal';
      };
      const data = [];
      prices.forEach((p, i) => {
        const t = new Date(p.startsAt).getTime();
        const next = i + 1 < prices.length ? new Date(prices[i + 1].startsAt).getTime() : 2 * t - new Date(prices[i - 1]?.startsAt ?? t - 900000).getTime();
        if (level(p) === cls) data.push([t, p.total * 100], [next - 1, p.total * 100]);
        else data.push([t, null]);
      });
      return data;
  # Cheapest window (sensor.tibber_cheapest_window)
  - entity: sensor.tibber_price_data
    name: Günstigstes Fenster
    yaxis_id: price
    unit: ct/kWh
    color: 43A047
    type: area
    curve: stepline
    opacity: 0.2
    stroke_width: 0
    extend_to: false
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const w = hass.states['sensor.tibber_cheapest_window'];
      if (!w || !w.attributes.end) return [];
      const s = new Date(w.state).getTime(), e = new Date(w.attributes.end).getTime();
      const prices = (entity.attributes.today || []).concat(entity.attributes.tomorrow || []);
      const data = prices
        .filter(p => { const t = new Date(p.startsAt).getTime(); return t >= s && t < e; })
        .map(p => [new Date(p.startsAt).getTime(), p.total * 100]);
      if (data.length) data.push([e, data[data.length - 1][1]]);
      return data;
  # Price limit (input_number.tibber_price_limit, 0 = off)
  - entity: input_number.tibber_price_limit
    name: Limit
    yaxis_id: price
    unit: ct/kWh
    color: B71C1C
    type: line
    stroke_width: 1
    stroke_dash: 6
    extend_to: false
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const limit = parseFloat(entity.state);
      return limit > 0 ? [[start.getTime(), limit], [end.getTime(), limit]] : [];
  # PV forecast from https://github.com/dominikamann/ha-machine-learning-based-pv-forecast
  # 15-minute values until now + 24 h, hourly values after that.
  - entity: sensor.pv_forecast_total_forecast_curve
    name: PV optimistisch (P90)
    yaxis_id: pv
    unit: kW
    color: 64B5F6
    type: area
    curve: smooth
    opacity: 0.12
    stroke_width: 0
    extend_to: false
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const key = 'p90';
      const quarter = (entity.attributes.quarters || [])
        .map(r => [new Date(r.time).getTime() + 7.5 * 60000, r[key] / 1000]);
      const last = quarter.length ? quarter[quarter.length - 1][0] : 0;
      const hourly = (entity.attributes.hourly || [])
        .map(r => [new Date(r.time).getTime() + 30 * 60000, r[key] / 1000])
        .filter(p => p[0] > last);
      return quarter.concat(hourly);
  - entity: sensor.pv_forecast_total_forecast_curve
    name: PV-Prognose
    yaxis_id: pv
    unit: kW
    color: 64B5F6
    type: area
    curve: smooth
    opacity: 0.35
    stroke_width: 2
    extend_to: false
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const key = 'p50';
      const quarter = (entity.attributes.quarters || [])
        .map(r => [new Date(r.time).getTime() + 7.5 * 60000, r[key] / 1000]);
      const last = quarter.length ? quarter[quarter.length - 1][0] : 0;
      const hourly = (entity.attributes.hourly || [])
        .map(r => [new Date(r.time).getTime() + 30 * 60000, r[key] / 1000])
        .filter(p => p[0] > last);
      return quarter.concat(hourly);
  - entity: sensor.pv_forecast_total_forecast_curve
    name: PV pessimistisch (P10)
    yaxis_id: pv
    unit: kW
    color: 64B5F6
    type: line
    curve: smooth
    stroke_width: 1
    stroke_dash: 4
    extend_to: false
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const key = 'p10';
      const quarter = (entity.attributes.quarters || [])
        .map(r => [new Date(r.time).getTime() + 7.5 * 60000, r[key] / 1000]);
      const last = quarter.length ? quarter[quarter.length - 1][0] : 0;
      const hourly = (entity.attributes.hourly || [])
        .map(r => [new Date(r.time).getTime() + 30 * 60000, r[key] / 1000])
        .filter(p => p[0] > last);
      return quarter.concat(hourly);
  # Actual PV production. Replace with your PV power sensor (in W; drop the transform if it is in kW).
  - entity: sensor.YOUR_PV_POWER
    name: PV tatsächlich
    yaxis_id: pv
    unit: kW
    color: 1E88E5
    type: line
    stroke_width: 2
    extend_to: now
    float_precision: 2
    transform: return x / 1000;
    group_by:
      func: avg
      duration: 15min
    show:
      in_header: false
      legend_value: false
  # Header only: current price and average of the cheapest window.
  # Keep these last: series hidden from the chart shift the y-axis scaling otherwise.
  - entity: sensor.tibber_price
    name: Aktuell
    yaxis_id: price
    unit: ct/kWh
    color: 9E9E9E
    transform: return x * 100;
    float_precision: 2
    show:
      in_chart: false
  - entity: sensor.tibber_cheapest_window
    attribute: average
    name: Günstigstes Fenster Ø
    yaxis_id: price
    unit: ct/kWh
    color: 43A047
    float_precision: 2
    show:
      in_chart: false
  # Optional: base load of your house. Where the PV curve is above it, the price hardly matters.
  # - entity: sensor.pv_forecast_total_forecast_curve
